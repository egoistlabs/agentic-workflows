<div class="safe">
  <div class="note-top">
    {{#label}}<p class="note-label">{{label}}</p>{{/label}}
    <p class="counter">{{slide.n}}/{{slide.count}}</p>
  </div>
  <div class="note-main">
    <h2 class="title note-title">{{title}}</h2>
    {{#quote}}<blockquote class="note-quote"><p class="prose">{{quote}}</p></blockquote>{{/quote}}
    {{#body}}<p class="prose note-body">{{body}}</p>{{/body}}
  </div>
</div>
