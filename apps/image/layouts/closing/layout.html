<div class="closing-glow" aria-hidden="true"></div>
<div class="safe">
  <div class="closing-top">
    {{#label}}<p class="closing-label">{{label}}</p>{{/label}}
    <p class="counter">{{slide.n}}/{{slide.count}}</p>
  </div>
  <div class="closing-main">
    <h2 class="title closing-title">{{title}}</h2>
    {{#body}}<p class="prose closing-body">{{body}}</p>{{/body}}
  </div>
  <div class="closing-bottom">
    <div class="closing-cta"><p class="closing-cta-text">{{cta}}</p><span class="closing-cta-arrow" aria-hidden="true"></span></div>
    {{#footer}}<p class="closing-footer">{{footer}}</p>{{/footer}}
  </div>
</div>
